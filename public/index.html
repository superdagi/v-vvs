<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesterålen VVS – Rørlegger i Sortland</title>
  <meta name="description" content="Vesterålen VVS – Din pålitelige rørlegger i Sortland. Kontakt oss for profesjonelle VVS-tjenester.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e0e0e0;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #101010;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.30);
      max-width: 500px;
      width: 100%;
      padding: 1.5rem 2.5rem;
      text-align: center;
    }
    .logo { max-width: 220px; margin-bottom: 0.75rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: #ffffff; }
    .subtitle { color: #aaa; font-size: 1rem; margin-bottom: 1rem; line-height: 1.5; }
    .divider { border: none; border-top: 2px solid #FF8C00; width: 60px; margin: 0 auto 1rem; }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      background: #383838;
      text-decoration: none;
      color: #e0e0e0;
      transition: background 0.2s, transform 0.2s;
    }
    .contact-item:hover { background: #4a3a20; transform: translateY(-1px); }
    .contact-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FF8C00;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.4rem;
    }
    .contact-text { text-align: left; }
    .contact-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .contact-value { font-size: 1.1rem; font-weight: 600; color: #fff; }
    .address {
      margin-top: 0.75rem;
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .address strong { color: #ddd; }
    .badge {
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 0.85rem;
    }
    .badge img { height: 140px; }
    .under-construction {
      padding: 0.75rem 1.25rem;
      background: #3d2e10;
      border-radius: 8px;
      color: #FFa500;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="v-vvs.png" alt="Vesterålen VVS" class="logo">
    <p class="subtitle">Din pålitelige partner for profesjonelle VVS-løsninger i Vesterålen</p>
    <hr class="divider">

    <a href="tel:+4790888400" class="contact-item">
      <div class="contact-icon">&#9742;</div>
      <div class="contact-text">
        <div class="contact-label">Telefon</div>
        <div class="contact-value">(+47) 90 88 84 00</div>
      </div>
    </a>

    <a href="mailto:post@v-vvs.no" class="contact-item">
      <div class="contact-icon">&#9993;</div>
      <div class="contact-text">
        <div class="contact-label">E-post</div>
        <div class="contact-value">post@v-vvs.no</div>
      </div>
    </a>

 

    <div class="badge">
      <img src="mester-logo.png" alt="Mesterbedrift">
    </div>

    <p style="color: #888; font-size: 0.8rem; margin-bottom: 0.3rem;">Org no. 937 539 320</p>

    <div class="under-construction">
      &#128736; Ny nettside er under utvikling – vi er snart tilbake!
    </div>
  </div>
</body>
</html>
